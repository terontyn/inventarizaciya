name: maintenance-service-test

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  test-maintenance-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run maintenance-service tests
        run: ./gradlew --no-daemon :services:maintenance-service:test --stacktrace --info

      - name: Upload maintenance-service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-service-test-report
          path: |
            services/maintenance-service/build/reports/tests/test/**
            services/maintenance-service/build/test-results/test/**
