name: bootstrap-check

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  verify-bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify bootstrap skeleton
        shell: pwsh
        run: ./scripts/ci/verify-bootstrap.ps1
