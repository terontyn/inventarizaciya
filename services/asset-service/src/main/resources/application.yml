spring:
  application:
    name: asset-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${ASSET_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/asset_service}
    username: ${ASSET_SERVICE_DB_USERNAME:postgres}
    password: ${ASSET_SERVICE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

integration:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}
    assign-handoff:
      enabled: ${INVENTORY_ASSIGN_HANDOFF_ENABLED:true}

server:
  port: ${SERVER_PORT:8081}
