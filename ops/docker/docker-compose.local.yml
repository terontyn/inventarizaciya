services:
  postgres:
    image: postgres:16-alpine
    container_name: itam-local-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
      - ../../scripts/db/init-local.sql:/docker-entrypoint-initdb.d/001-init-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-local-data:
